<!DOCTYPE html>
<html>
<head>
  <title>Add Student</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- ✅ Navbar (Linkup done) -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Student App</a>

    <div>
      <a href="index.html" class="btn btn-outline-light me-2">Add Student</a>
      <a href="view.html" class="btn btn-outline-light">View Students</a>
    </div>
  </div>
</nav>

<!-- Form -->
<div class="container mt-5">
  <div class="card p-4 shadow">

    <h3 class="text-center mb-4">Add Student</h3>

    <form id="form">

      <input id="key" class="form-control mb-3" placeholder="Storage Key (e.g: abc)">
      <input id="id" class="form-control mb-3" placeholder="Student ID">
      <input id="name" class="form-control mb-3" placeholder="Name">
      <input id="email" class="form-control mb-3" placeholder="Email">
      <input id="phone" class="form-control mb-3" placeholder="Phone">
      <input id="course" class="form-control mb-3" placeholder="Course">

      <button class="btn btn-primary w-100">Add Student</button>

    </form>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
