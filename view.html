<!DOCTYPE html>
<html>
<head>
  <title>View Students</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- ✅ Navbar (Linkup done) -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Student App</a>

    <div>
      <a href="index.html" class="btn btn-outline-light me-2">Add Student</a>
      <a href="view.html" class="btn btn-outline-light">View Students</a>
    </div>
  </div>
</nav>

<!-- Content -->
<div class="container mt-5">

  <div class="card p-4 shadow">

    <h3 class="text-center mb-4">View Students</h3>

    <div class="row mb-3">
      <div class="col-md-8">
        <input id="viewKey" class="form-control" placeholder="Enter Storage Key">
      </div>

      <div class="col-md-4">
        <button onclick="loadData()" class="btn btn-success w-100">
          Load Data
        </button>
      </div>
    </div>

    <!-- Table -->
    <div class="table-responsive">
      <table class="table table-bordered table-striped text-center">

        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Course</th>
          </tr>
        </thead>

        <tbody id="table"></tbody>

      </table>
    </div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
